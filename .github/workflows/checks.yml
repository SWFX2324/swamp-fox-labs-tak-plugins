name: Checks

# Only what can run without WinTAK's SDK, which is licensed separately and isn't on GitHub's machines.
# Contributors run the build and offline tests themselves; see CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Windows PowerShell, because that's what the build and tests run under.
      - name: Check committed files and PowerShell scripts
        shell: powershell
        run: .\.github\scripts\Check-Repo.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check issue forms and workflows
        shell: powershell
        run: |
          npm install --silent --no-save --no-package-lock --prefix "$env:RUNNER_TEMP" js-yaml@4.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_PATH = Join-Path $env:RUNNER_TEMP "node_modules"
          node .github\scripts\check-github-files.js
